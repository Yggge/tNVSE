[FreeTypeFont]
; Отображать шрифты, настроенные в разделе <fonts> файла tnvse_fonts.xml,
; с помощью векторных контуров FreeType.
; Этот параметр не зависит от bEnableMultibyteFontHook.
; FreeType использует Windows-1252 при uiEncoding=0 и Windows-1251
; при uiEncoding=5. Для восточноазиатских кодировок 1–4 дополнительно
; требуется включить Multibyte.
bEnableFreeTypeFontRendering = 1

; Записывать диагностическую информацию о загрузке и отображении
; шрифтов FreeType в файл tnvse.log.
; Включайте только при поиске неисправностей: журналирование
; увеличивает нагрузку на процессор и диск.
bEnableFreeTypeFontRenderingLog = 0

; Фиксированный множитель исходного разрешения FreeType.
; Допустимый диапазон: 0.1–10.0.
; Увеличение значения повышает время предварительной загрузки,
; объём масок и использование атласов, но не меняет отображаемый размер шрифта.
; Значение по умолчанию: 1.0.
fFreeTypeFontResolutionScale = 1.0

; Лимит оперативной памяти в МБ для кэшей глифов, раскладки текста,
; атласов и метаданных FreeType.
; Допустимый диапазон: 64–384. Значение по умолчанию: 128.
uiFreeTypeFontMemoryCacheMB = 128

; Удалять устаревшие кэши FreeType tNVSE, не используемые текущей конфигурацией.
; Неизвестные файлы в каталоге fontdata не удаляются.
; Значение по умолчанию: 0.
bDeleteUnusedFreeTypeFontCache = 1

; Разрешить tNVSE создавать и восстанавливать текстуры атласов FreeType
; в D3DPOOL_DEFAULT.
; При отключении используется путь управления атласами игровым движком.
bEnableFreeTypeDefaultPoolAtlas = 1

; Использовать собственный маршрут TileShader для отображения
; дистанционных полей, если доступен Fallout Shader Loader версии 1.40 или новее.
; При отключении всегда используется встроенный резервный вариант
; атласов на основе стандартных шейдеров игры.
bEnableFreeTypeNativeAtlas = 1

; Использовать штатную геометрию игрового движка для раскладки текста,
; если текст размещается на одной странице и соответствует условиям.
; 0 — использовать собственный интерфейс Native Facade/CommandBuffer.
; После изменения параметра требуется перезапуск игры.
; Значение по умолчанию: 1.
bEnableFreeTypeFontVanillaLayout = 1

; Пропускать отображение текста FreeType, если достоверно установлено,
; что он находится за пределами области интерфейса или Tile Scissor.
; В неоднозначных случаях текст отображается обычным способом.
; Отключайте при поиске причин обрезания текста.
; Значение по умолчанию: 1.
bEnableFreeTypeFontPreflightClipCull = 1

; Включить сохранение и повторное воспроизведение команд отрисовки FreeType.
; Для неподдерживаемых состояний отображения автоматически
; используется обычный маршрут.
bEnableFreeTypeFontCommandBuffer = 1

; Выбор полного представления для отображения шрифтов FreeType.
; 0 — вариант с заранее подготовленными эффектами, близкий к стандартному.
;     Заливка, тень, свечение и контур заранее объединяются в текстуру BGRA.
;     Снижает нагрузку на шейдеры во время игры, но хуже масштабируется.
; 1 — TSDF в формате D3DFMT_A8 (меньше расход кэша и видеопамяти).
; 2 — MTSDF в формате D3DFMT_A8R8G8B8
;     (наилучшее качество краёв дистанционных полей).
; Если собственный маршрут шейдеров недоступен, tNVSE использует
; совместимый вариант ARGB.
; Значение по умолчанию: 2.
uiFreeTypeFontDistanceFieldMode = 2

; Лимит кэша графических атласов FreeType в видеопамяти, МБ.
; 0 — все снимки атласов настроенных шрифтов постоянно хранятся в GPU;
;     вытеснение по программному лимиту памяти отключается.
; Ненулевое значение задаёт мягкий лимит.
uiFreeTypeFontGpuAtlasCacheMB = 0

; Объединять совместимые слои эффектов дистанционных полей
; в один вызов отрисовки Native Tile.
; Несовместимые фрагменты текста и текст с разных страниц
; обрабатываются обычным способом.
bEnableFreeTypeFontCompositePass = 1

; Отключить тень, свечение и контур FreeType только для форматированного
; текста в режимах TSDF/MTSDF.
; Заливка символов, сглаживание SDF и все остальные способы отображения
; текста остаются без изменений.
; 0 — эффекты включены.
; 1 — эффекты отключены.
; Значение по умолчанию: 0.
bDisableFreeTypeRichTextEffects = 1

; Сохранять значок поиска Pip-Boy UI Tweaks в виде лупы,
; когда поле поиска неактивно и пусто.
; Отключайте только при поиске конфликта с заменой интерфейса Pip-Boy.
; Значение по умолчанию: 1.
bFixPipBoySearchIcon = 1

; Отдельный лимит видеопамяти в МБ для кэширования готовых
; составных текстур отображаемого текста.
; 0 — отключить сохранение готовых текстур текста.
; Допустимый диапазон: 0–512. Значение по умолчанию: 32.
uiFreeTypeFontCompositeCacheMB = 32

[Multibyte]
; Для логических параметров используются значения:
; 0 — отключено, 1 — включено.
; Используйте точные названия разделов и параметров, указанные в этом файле.

; Основной переключатель многоязыковых шрифтов и текстовых перехватчиков.
; FreeTypeFont может работать независимо от этого параметра.
; При отключении блокируются многоязыковая раскладка восточноазиатского текста
; и все параметры разделов Multibyte, MultibyteInput и Dictionary.
; Однобайтовый режим Windows-1251 для FreeType при uiEncoding=5
; продолжает работать.
bEnableMultibyteFontHook = 0

; Выбор кодировки пользовательского интерфейса игры.
; Требуются соответствующие игровые шрифты.
; 0 — английский язык (Windows-1252, однобайтовая кодировка).
; 1 — упрощённый китайский (GBK, кодовая страница Windows 936).
; 2 — традиционный китайский (Big5, кодовая страница Windows 950).
; 3 — японский (Shift-JIS, кодовая страница Windows 932).
; 4 — корейский (UHC, кодовая страница Windows 949).
; 5 — кириллица (Windows-1251, однобайтовая кодировка; только FreeType).
uiEncoding = 5

; Обнаруживать исходный текст UTF-8 и преобразовывать его
; в выбранную кодировку интерфейса.
; Требуются uiEncoding=1, 2, 3 или 4 и соответствующие игровые шрифты.
; При uiEncoding=5 преобразование UTF-8 не включается.
bUTF8 = 0

; Заменять описание навыка «Тяжёлое оружие»,
; добавляемое модом JIP LN NVSE.
; Поддерживается только JIP LN NVSE версии 57.30.
bChangeJIPBigGunDesc = 0

; Текст, которым заменяется описание навыка «Тяжёлое оружие»,
; если bChangeJIPBigGunDesc=1.
sNewBigGunsDesc = "Навык тяжёлого оружия определяет эффективность использования всех видов тяжёлого вооружения, включая гранатомёт «Толстяк», ракетную установку, огнемёт, миниган и лазерный гатлинг."

; Изменять порядок отображения подсказок при активации дверей и ячеек.
; 0 — «название двери» + «sTo GMST» + «название ячейки» (по умолчанию).
; 1 — «sTo» + «название ячейки» + «sOptionalStructuralParticle» + «название двери».
; 2 — «название ячейки» + «sTo» + «sOptionalStructuralParticle» + «название двери».
; Параметр sTo является игровой настройкой и может редактироваться
; с помощью GECK или Stewie Tweaks.
uiReorderDoorPrompt = 0

; Дополнительная грамматическая частица, вставляемая
; в режимах отображения подсказок дверей 1 и 2.
; Установите "" для отключения.
sOptionalStructuralParticle = ""

; Удалять английское окончание множественного числа «s»
; из названий рас в меню создания персонажа.
bRemovePlural = 0

; Сохранять многоязычные имена ручных сохранений
; с помощью сопоставления в co-save.
bSaveDisplayNameMap = 0

[MultibyteInput]
; Основной переключатель многоязыкового ввода текста и IME.
; Требуются bEnableMultibyteFontHook=1, успешная установка
; многоязыкового перехватчика и uiEncoding=1, 2, 3 или 4.
; uiEncoding=5 является однобайтовой кодировкой и не включает этот механизм.
bMultibyteInput = 0

; Записывать подробную диагностику состояния и событий
; многоязыкового ввода в tnvse.log.
; Включайте только при поиске неисправностей:
; журнал может создавать значительный объём данных.
bMultibyteInputLog = 0

; Показывать набираемый текст, список кандидатов и состояние IME
; во встроенном компоненте Tile из файла
; Data\Menus\prefabs\tNVSE\ImeOverlay.xml.
; Для текста используется штатный слот шрифта 1,
; поэтому его отображение зависит от активной конфигурации шрифтов tNVSE.
; При отключении подтверждённый текст всё равно будет вводиться.
bMultibyteInputCompositionPreview = 0

; Системный интерфейс кандидатов и композиции операционной системы
; всегда подавляется при установленном механизме многоязыкового ввода tNVSE.
; Если встроенный XML Tile недоступен, подтверждённый текст продолжит
; вводиться, но интерфейс кандидатов отображаться не будет.

; Получать список кандидатов через TSF, если эта технология доступна.
; Если параметр отключён или TSF недоступен, tNVSE использует
; резервный интерфейс кандидатов IMM32.
bMultibyteInputUseTSFCandidates = 0

; Включить многоязыковый ввод в полях конфигурации Stewie Tweaks
; и поисковых полях MenuSearch.
; StewMenu использует UTF-8; MenuSearch использует выбранную кодировку интерфейса.
; Требуется bMultibyteInput=1.
; Числовые поля, поля с плавающей точкой, шестнадцатеричные поля
; и поля горячих клавиш не обрабатываются.
bMultibyteInputStewieTweaks = 0

; Включить многоязыковый ввод в поле поиска списка модов MCM Extender.
; Требуется параметр подавления событий клавиатуры JIP LN 57.30,
; указанный ниже.
bMultibyteInputMCMExtender = 0

; Включить многоязыковый ввод в поле поиска имён NPC
; в Dialogue History.
; Требуется параметр подавления событий клавиатуры JIP LN 57.30,
; указанный ниже.
bMultibyteInputDialogueHistory = 0

; Включить многоязыковый ввод в поле поиска Modern Help Menu.
; Требуется параметр подавления событий клавиатуры JIP LN 57.30,
; указанный ниже.
bMultibyteInputModernHelpMenu = 0

; Подавлять события клавиатуры OnKeyDown/OnKeyUp от JIP LN,
; пока фокус находится в текстовом поле, управляемом многоязыковым вводом tNVSE.
; Физическое состояние клавиш при этом синхронизируется:
; закрытие поля не вызывает отложенное нажатие или несоответствующее отпускание.
; События мыши и контроллера не изменяются.
; Поддерживается только JIP LN NVSE версии 57.30.
bSuppressJIPKeyEventsDuringMultibyteInput = 0

[Dictionary]
; Основной переключатель перевода текста с помощью словаря во время игры.
; Источники словаря настраиваются в файле
; Data\NVSE\plugins\tnvse_dictionary.xml.
; Поиск по ID и полному совпадению всегда включён,
; пока активен этот параметр.
; Все остальные параметры раздела Dictionary игнорируются,
; если перевод словарём отключён.
bEnableDictionaryTranslation = 0

; Отключать поиск совпадений в словаре при открытой игровой консоли.
; Это предотвращает обработку команд и сообщений консоли правилами словаря.
; Отображение FreeType и многоязыковый ввод продолжают работать.
; Установите 0, чтобы разрешить перевод текста консоли.
bDisableDictionaryTranslationInConsole = 0

; Записывать в tnvse.log сведения о загрузке словаря,
; поиске совпадений и замене текста.
; Включайте только при поиске неисправностей:
; журналирование может создавать значительный объём данных.
bEnableDictionaryTranslationLog = 0

; Включить обработчик сегментов заданий MUX:
; Added:, Complete: и Fail:.
bEnableMuxQuestPromptTranslation = 0

; Включить структурированный перевод требований и описаний
; особенностей и способностей (Perk/Trait).
; Обрабатывает поля Req:, Ranks:, Source:, Level, AND, OR и NOT.
bEnableDictionaryPerkDescriptionTranslation = 0

; Включить структурированный перевод эффектов предметов,
; разделённых запятыми или переносами строк.
; Пример: "HP +2, Rads +8".
bEnableDictionaryItemEffectTranslation = 0

; Включить структурированный перевод текста о боеприпасах
; и количестве выстрелов оружия.
; Пример: "MF Cell x 3".
bEnableDictionaryMultiplierTextTranslation = 0

; Разрешить обработку записей словаря с подстановочным символом [%].
bEnableDictionaryWildcardTranslation = 0

; Включить правила замены с использованием <regex />
; в файле tnvse_dictionary.xml.
bEnableDictionaryRegexTranslation = 0

; Разрешить правилам с подстановочными символами, регулярными выражениями
; и структурированными требованиями Perk обрабатывать исходный текст,
; содержащий одновременно символы DBCS и ASCII.
; Требует включения соответствующего параметра для подстановочных символов,
; регулярных выражений или описаний Perk.
; Нечёткий поиск и другие структурированные маршруты перевода
; для смешанного текста остаются отключёнными.
; По умолчанию отключено, чтобы избежать повторного перевода
; уже локализованных строк.
bEnableDictionaryMixedSourceTranslation = 0

; Переводить каждую строку многострочного текста отдельно
; с помощью точного поиска, сохраняя исходные разделители строк.
bEnableDictionaryBeforeLinebreakTranslation = 0

; Повторять неудачный поиск, постепенно удаляя текст
; с начала или конца строки.
bEnableDictionaryShrinkFuzzyTranslation = 0

; Повторять неудачный поиск с использованием заданных правил
; удаления префиксов и суффиксов, а также обходных условий.
bEnableDictionaryTrimBypassFuzzyTranslation = 0